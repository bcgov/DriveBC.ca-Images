services:
  image-receiver:
    container_name: image-receiver
    build:
      context: ../..
      dockerfile: compose/image_receiver/Dockerfile
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://localuser:localpass@rabbitmq:5672/}
      LOCATION_USER_PASS_MAPPING: ${LOCATION_USER_PASS_MAPPING:-}
      SCRIPTED_IP_MAPPING: ${SCRIPTED_IP_MAPPING:-}
      DB_SERVER: ${DB_SERVER:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CLUSTER: ${CLUSTER:-GOLD}
      RABBITMQ_GOLD_URL: ${RABBITMQ_GOLD_URL:-amqp://localuser:localpass@rabbitmq:5672/}
      RABBITMQ_GOLDDR_URL: ${RABBITMQ_GOLDDR_URL:-amqp://localuser:localpass@rabbitmq:5672/}
      RABBITMQ_EXCHANGE_NAME: ${RABBITMQ_EXCHANGE_NAME:-local.exchange.fanout}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-5242880}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: image-receiver-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-localuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-localpass}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5